name: Epic Core API

forge-1.20.1:
  required_when_enabled: true
  gradle: |
    repositories {
      maven {
        url = "https://cursemaven.com"
        content {
          includeGroup "curse.maven"
        }
      }
    }
    dependencies {
      // 使用 dev jar（包含 MCP 映射的 refmap），无需 fg.deobf()
      implementation "curse.maven:epic-core-api-977556:7559826"
    }
