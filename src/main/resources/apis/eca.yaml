name: Epic Core API

forge-1.20.1:
  required_when_enabled: true
  gradle: |
    repositories {
      maven {
        url = "https://api.modrinth.com/maven"
        content {
          includeGroup "maven.modrinth"
        }
      }
    }
    dependencies {
      def libDir = new File(System.getProperty("user.home"), ".mcreator/lib")
      def ecaJarPattern = ~/^epic-core-api-(\d+(?:\.\d+)*)((?:-fix)*)(?:-|_)dev\.jar$/
      def ecaJars = fileTree(
          dir: libDir,
          includes: ['epic-core-api-*-dev.jar', 'epic-core-api-*_dev.jar']
      ).files.findAll { it.name ==~ ecaJarPattern }
      if (!ecaJars.isEmpty()) {
        def versionParts = { jar ->
          def matcher = jar.name =~ ecaJarPattern
          matcher.matches()
          matcher.group(1).tokenize('.').collect { it as int }
        }
        def latestEca = ecaJars.max { left, right ->
          def leftVersion = versionParts(left)
          def rightVersion = versionParts(right)
          def partCount = Math.max(leftVersion.size(), rightVersion.size())
          for (int i = 0; i < partCount; i++) {
            def leftPart = i < leftVersion.size() ? leftVersion[i] : 0
            def rightPart = i < rightVersion.size() ? rightVersion[i] : 0
            if (leftPart != rightPart) {
              return leftPart <=> rightPart
            }
          }
          def leftMatch = left.name =~ ecaJarPattern
          def rightMatch = right.name =~ ecaJarPattern
          leftMatch.matches()
          rightMatch.matches()
          def fixOrder = leftMatch.group(2).count('-fix') <=> rightMatch.group(2).count('-fix')
          return fixOrder != 0 ? fixOrder : left.name <=> right.name
        }
        implementation files(latestEca)
      } else {
        implementation fg.deobf("maven.modrinth:epic-core-api:1.1.8-fix-fix:dev")
      }
    }
