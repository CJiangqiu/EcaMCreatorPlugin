blockly.block.eca_force_set_health=Force set %1 health to %2
blockly.block.eca_force_set_health.tooltip=Forcefully set an entity's health using Epic Core API.

blockly.block.eca_force_kill=Force kill %1
blockly.block.eca_force_kill.tooltip=Forcefully kill an entity using Epic Core API.

blockly.block.eca_force_revive=Force revive %1
blockly.block.eca_force_revive.tooltip=Forcefully revive an entity using Epic Core API.

blockly.block.eca_force_revive_uuid=Force revive entity by UUID %1
blockly.block.eca_force_revive_uuid.tooltip=Forcefully revive an entity by UUID using Epic Core API. Useful when the entity has been removed from the world.

blockly.block.eca_force_remove=Force remove %1
blockly.block.eca_force_remove.tooltip=Forcefully remove an entity using Epic Core API.

blockly.block.eca_set_force_invulnerable=Set %1 force invulnerable: %2
blockly.block.eca_set_force_invulnerable.tooltip=Toggle strong invulnerability using Epic Core API.

blockly.block.eca_lock_health=Lock %1 health at %2
blockly.block.eca_lock_health.tooltip=Lock entity health at a specific value (for boss invincibility phases, beginner protection, etc.).

blockly.block.eca_unlock_health=Unlock %1 health
blockly.block.eca_unlock_health.tooltip=Unlock entity health, allowing it to change normally.

blockly.block.eca_is_health_locked=Is %1 health locked
blockly.block.eca_is_health_locked.tooltip=Check if an entity's health is locked.

blockly.block.eca_get_locked_health=Get %1 locked health value
blockly.block.eca_get_locked_health.tooltip=Get the locked health value for an entity (returns 0 if not locked).

blockly.block.eca_force_get_health=Force get %1 real health
blockly.block.eca_force_get_health.tooltip=Get entity's real health using direct access, bypassing any custom implementations.

blockly.block.eca_is_force_invulnerable=Is %1 force invulnerable
blockly.block.eca_is_force_invulnerable.tooltip=Check if an entity has force invulnerability enabled (ECA system).

blockly.block.eca_force_teleport=Force teleport %1 to x:%2 y:%3 z:%4
blockly.block.eca_force_teleport.tooltip=Teleport an entity to the specified location using direct access.

blockly.block.eca_cleanup_boss_bar=Cleanup %1 boss bar
blockly.block.eca_cleanup_boss_bar.tooltip=Clean up boss bars associated with an entity.

blockly.block.eca_enable_all_return=Enable AllReturn for %1 [DANGER]
blockly.block.eca_enable_all_return.tooltip=DANGER! Requires "Enable Radical Logic" in config. Performs return transformation on all methods of the entity's mod.

blockly.block.eca_disable_all_return=Disable AllReturn
blockly.block.eca_disable_all_return.tooltip=Disable AllReturn and clear all targets.

blockly.block.eca_is_all_return_enabled=Is AllReturn enabled
blockly.block.eca_is_all_return_enabled.tooltip=Check if AllReturn is currently enabled.

blockly.block.eca_memory_remove_entity=Memory remove %1 [DANGER]
blockly.block.eca_memory_remove_entity.tooltip=DANGER! Requires "Enable Radical Logic" in config. Uses LWJGL API to remove entity from memory.

blockly.block.eca_add_health_whitelist_keyword=Add health whitelist keyword: %1
blockly.block.eca_add_health_whitelist_keyword.tooltip=Add a keyword to the health whitelist. Fields containing this keyword will be modified during health changes.

blockly.block.eca_remove_health_whitelist_keyword=Remove health whitelist keyword: %1
blockly.block.eca_remove_health_whitelist_keyword.tooltip=Remove a keyword from the health whitelist.

blockly.block.eca_add_health_blacklist_keyword=Add health blacklist keyword: %1
blockly.block.eca_add_health_blacklist_keyword.tooltip=Add a keyword to the health blacklist. Fields containing this keyword will be skipped during health changes.

blockly.block.eca_remove_health_blacklist_keyword=Remove health blacklist keyword: %1
blockly.block.eca_remove_health_blacklist_keyword.tooltip=Remove a keyword from the health blacklist.

blockly.block.eca_add_spawn_ban=Ban %1 spawn for %2 seconds
blockly.block.eca_add_spawn_ban.tooltip=Ban an entity type from spawning in the current dimension for the specified time.

blockly.block.eca_is_spawn_banned=Is %1 spawn banned
blockly.block.eca_is_spawn_banned.tooltip=Check if an entity type is banned from spawning in the current dimension.

blockly.block.eca_get_spawn_ban_time=Get %1 spawn ban remaining time
blockly.block.eca_get_spawn_ban_time.tooltip=Get the remaining time (in seconds) for an entity type's spawn ban.

blockly.block.eca_clear_spawn_ban=Clear %1 spawn ban
blockly.block.eca_clear_spawn_ban.tooltip=Clear the spawn ban for a specific entity type in the current dimension.

blockly.block.eca_clear_all_spawn_bans=Clear all spawn bans
blockly.block.eca_clear_all_spawn_bans.tooltip=Clear all spawn bans in the current dimension.

blockly.block.eca_set_global_all_return=Set global AllReturn: %1 [DANGER]
blockly.block.eca_set_global_all_return.tooltip=DANGER! Requires "Enable Radical Logic" in config. Enable/disable global AllReturn mode which affects ALL mods' boolean and void methods.

blockly.block.eca_add_protected_package=Add protected package: %1
blockly.block.eca_add_protected_package.tooltip=Add a package prefix to the whitelist. Classes in protected packages will not be affected by AllReturn and other dangerous operations.

blockly.block.eca_remove_protected_package=Remove protected package: %1
blockly.block.eca_remove_protected_package.tooltip=Remove a package prefix from the whitelist. Built-in protections (JDK, Minecraft, Forge, etc.) cannot be removed.

blockly.block.eca_is_package_protected=Is %1 protected
blockly.block.eca_is_package_protected.tooltip=Check if a class name is protected by the whitelist.

blockly.block.eca_set_max_health=Force set %1 max health to %2
blockly.block.eca_set_max_health.tooltip=Set entity max health to a precise value by reverse-calculating the attribute base value.

blockly.block.eca_lock_max_health=Lock %1 max health at %2
blockly.block.eca_lock_max_health.tooltip=Lock entity max health at a specific value. Any external modifications (equipment, potions) will be overridden each tick.

blockly.block.eca_unlock_max_health=Unlock %1 max health
blockly.block.eca_unlock_max_health.tooltip=Unlock entity max health, allowing it to be modified normally by equipment, potions, etc.

blockly.block.eca_is_max_health_locked=Is %1 max health locked
blockly.block.eca_is_max_health_locked.tooltip=Check if an entity's max health is locked.

blockly.block.eca_get_locked_max_health=Get %1 locked max health value
blockly.block.eca_get_locked_max_health.tooltip=Get the locked max health value for an entity (returns 0 if not locked).

blockly.block.eca_ban_healing=Set %1 heal ban value to %2
blockly.block.eca_ban_healing.tooltip=Ban healing for an entity. The entity cannot receive healing but can still take damage.

blockly.block.eca_unban_healing=Unban %1 healing
blockly.block.eca_unban_healing.tooltip=Unban healing for an entity, allowing it to receive healing normally.

blockly.block.eca_is_healing_banned=Is %1 healing banned
blockly.block.eca_is_healing_banned.tooltip=Check if an entity has healing banned.

blockly.block.eca_get_heal_ban_value=Get %1 heal ban value
blockly.block.eca_get_heal_ban_value.tooltip=Get the current heal ban value for an entity (returns 0 if not banned).

blockly.block.eca_lock_location=Lock %1 location
blockly.block.eca_lock_location.tooltip=Lock entity location at its current position. Abnormal position changes will be reverted.

blockly.block.eca_unlock_location=Unlock %1 location
blockly.block.eca_unlock_location.tooltip=Unlock entity location, allowing it to be moved/teleported freely.

blockly.block.eca_is_location_locked=Is %1 location locked
blockly.block.eca_is_location_locked.tooltip=Check if an entity's location is locked.

blockly.block.eca_set_global_fog=Set global fog color: %1 mode: %2 radius: %3
blockly.block.eca_set_global_fog.tooltip=Set global fog effect for the current dimension. Color selects a preset, mode can be Global (entire dimension) or Radius (around entities).

blockly.block.eca_clear_global_fog=Clear global fog
blockly.block.eca_clear_global_fog.tooltip=Clear global fog effect for the current dimension.

blockly.block.eca_set_global_skybox=Set global skybox preset: %1 alpha: %2
blockly.block.eca_set_global_skybox.tooltip=Set global skybox shader effect for the current dimension.

blockly.block.eca_clear_global_skybox=Clear global skybox
blockly.block.eca_clear_global_skybox.tooltip=Clear global skybox effect for the current dimension.

blockly.block.eca_set_global_music=Set global music: %1 source: %2 volume: %3 pitch: %4 loop: %5
blockly.block.eca_set_global_music.tooltip=Set global combat music for the current dimension.

blockly.block.eca_clear_global_music=Clear global music
blockly.block.eca_clear_global_music.tooltip=Clear global combat music for the current dimension.

blockly.block.eca_clear_all_global_effects=Clear all global effects
blockly.block.eca_clear_all_global_effects.tooltip=Clear all global effects (fog, skybox, music) for the current dimension.

blockly.block.eca_entities_in_range_foreach=Force get each entity in range x: %1 y: %2 z: %3 range: %4 as %5 do %6
blockly.block.eca_entities_in_range_foreach.tooltip=Iterate entities in range using ECA API (bypasses Mixin modifications to entity queries).

blockly.block.eca_dimension_entities_foreach=Force get each entity in current dimension as %1 do %2
blockly.block.eca_dimension_entities_foreach.tooltip=Iterate ALL entities in the current dimension using ECA API (no range limit).

blockly.block.eca_server_entities_foreach=Force get each entity on server (all dimensions) as %1 do %2
blockly.block.eca_server_entities_foreach.tooltip=Iterate ALL entities across ALL dimensions on the server using ECA API.

blockly.block.eca_dimension_typed_entities_foreach=Force get each %1 in dimension %2 as %3 do %4
blockly.block.eca_dimension_typed_entities_foreach.tooltip=Iterate entities of a specific type in a specific dimension using ECA API.

blockly.block.eca_set_force_loading=Set %1 force loading: %2
blockly.block.eca_set_force_loading.tooltip=Enable or disable force chunk loading for an entity using Epic Core API.

blockly.block.eca_is_force_loaded=Is %1 force loaded
blockly.block.eca_is_force_loaded.tooltip=Check if an entity is force loaded.
