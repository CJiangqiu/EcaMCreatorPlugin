blockly.block.eca_force_set_health=强制设置 %1 的生命值为 %2
blockly.block.eca_force_set_health.tooltip=使用 Epic Core API 强制设置实体的生命值

blockly.block.eca_force_kill=强制杀死 %1
blockly.block.eca_force_kill.tooltip=使用 Epic Core API 强制杀死实体

blockly.block.eca_force_revive=强制复活 %1
blockly.block.eca_force_revive.tooltip=使用 Epic Core API 强制复活实体

blockly.block.eca_force_revive_uuid=通过 UUID %1 强制复活实体
blockly.block.eca_force_revive_uuid.tooltip=使用 Epic Core API 通过 UUID 强制复活实体，适用于实体已被移除的情况

blockly.block.eca_force_remove=强制移除实体 %1
blockly.block.eca_force_remove.tooltip=使用 Epic Core API 强制移除实体

blockly.block.eca_set_force_invulnerable=设置 %1 强制无敌：%2
blockly.block.eca_set_force_invulnerable.tooltip=使用 Epic Core API 设置强制无敌状态

blockly.block.eca_lock_health=锁定 %1 的血量为 %2
blockly.block.eca_lock_health.tooltip=锁定实体血量至指定值（用于Boss无敌阶段、新手保护等）

blockly.block.eca_unlock_health=解锁 %1 的血量
blockly.block.eca_unlock_health.tooltip=解锁实体血量，允许其正常变化

blockly.block.eca_is_health_locked=%1 的血量是否已锁定
blockly.block.eca_is_health_locked.tooltip=检查实体血量是否已锁定

blockly.block.eca_get_locked_health=获取 %1 的锁定血量值
blockly.block.eca_get_locked_health.tooltip=获取实体的锁定血量值（如果未锁定则返回0）

blockly.block.eca_force_get_health=强制获取 %1 的真实血量
blockly.block.eca_force_get_health.tooltip=使用直接访问获取实体的真实血量，绕过任何自定义实现

blockly.block.eca_is_force_invulnerable=%1 是否处于强制无敌状态
blockly.block.eca_is_force_invulnerable.tooltip=检查实体是否启用了强制无敌（ECA系统）

blockly.block.eca_force_teleport=强制传送 %1 到 x:%2 y:%3 z:%4
blockly.block.eca_force_teleport.tooltip=使用直接访问将实体传送到指定位置

blockly.block.eca_cleanup_boss_bar=清理 %1 的Boss血条
blockly.block.eca_cleanup_boss_bar.tooltip=清理与实体关联的Boss血条

blockly.block.eca_enable_all_return=启用 %1 的AllReturn [危险]
blockly.block.eca_enable_all_return.tooltip=危险！需要在配置文件中启用"激进攻击逻辑"。会对目标实体所属mod的全部方法进行return转换。

blockly.block.eca_disable_all_return=禁用AllReturn
blockly.block.eca_disable_all_return.tooltip=禁用AllReturn并清空所有目标

blockly.block.eca_is_all_return_enabled=AllReturn是否已启用
blockly.block.eca_is_all_return_enabled.tooltip=检查AllReturn是否当前已启用

blockly.block.eca_memory_remove_entity=内存移除 %1 [危险]
blockly.block.eca_memory_remove_entity.tooltip=危险！需要在配置中启用"激进攻击逻辑"。使用LWJGL API从内存中移除实体。

blockly.block.eca_add_health_whitelist_keyword=添加血量白名单关键字：%1
blockly.block.eca_add_health_whitelist_keyword.tooltip=添加血量白名单关键字。包含此关键字的字段将在血量修改时被修改。

blockly.block.eca_remove_health_whitelist_keyword=移除血量白名单关键字：%1
blockly.block.eca_remove_health_whitelist_keyword.tooltip=从血量白名单中移除关键字。

blockly.block.eca_add_health_blacklist_keyword=添加血量黑名单关键字：%1
blockly.block.eca_add_health_blacklist_keyword.tooltip=添加血量黑名单关键字。包含此关键字的字段将在血量修改时被跳过。

blockly.block.eca_remove_health_blacklist_keyword=移除血量黑名单关键字：%1
blockly.block.eca_remove_health_blacklist_keyword.tooltip=从血量黑名单中移除关键字。

blockly.block.eca_add_spawn_ban=禁止 %1 生成 %2 秒
blockly.block.eca_add_spawn_ban.tooltip=在当前维度禁止指定实体类型生成一段时间。

blockly.block.eca_is_spawn_banned=%1 是否被禁止生成
blockly.block.eca_is_spawn_banned.tooltip=检查实体类型是否在当前维度被禁止生成。

blockly.block.eca_get_spawn_ban_time=获取 %1 的禁生成剩余时间
blockly.block.eca_get_spawn_ban_time.tooltip=获取实体类型禁生成的剩余时间（秒）。

blockly.block.eca_clear_spawn_ban=清除 %1 的禁生成
blockly.block.eca_clear_spawn_ban.tooltip=清除当前维度中指定实体类型的禁生成。

blockly.block.eca_clear_all_spawn_bans=清除所有禁生成
blockly.block.eca_clear_all_spawn_bans.tooltip=清除当前维度的所有禁生成。

blockly.block.eca_set_global_all_return=设置全局AllReturn：%1 [危险]
blockly.block.eca_set_global_all_return.tooltip=危险！需要在配置中启用"激进攻击逻辑"。启用/禁用全局AllReturn模式，将影响所有mod的boolean和void方法。

blockly.block.eca_add_protected_package=添加受保护的包名：%1
blockly.block.eca_add_protected_package.tooltip=将包名前缀添加到白名单。受保护包中的类不会受到AllReturn等危险操作的影响。

blockly.block.eca_remove_protected_package=移除受保护的包名：%1
blockly.block.eca_remove_protected_package.tooltip=从白名单中移除包名前缀。内置保护（JDK、Minecraft、Forge等）无法移除。

blockly.block.eca_is_package_protected=%1 是否受保护
blockly.block.eca_is_package_protected.tooltip=检查类名是否在白名单保护中。

blockly.block.eca_set_max_health=强制设置 %1 的最大生命值为 %2
blockly.block.eca_set_max_health.tooltip=通过反向计算属性基础值来精确设置实体的最大生命值。

blockly.block.eca_lock_max_health=锁定 %1 的最大生命值为 %2
blockly.block.eca_lock_max_health.tooltip=锁定实体最大生命值至指定值。任何外部修改（装备、药水）将每tick被覆盖。

blockly.block.eca_unlock_max_health=解锁 %1 的最大生命值
blockly.block.eca_unlock_max_health.tooltip=解锁实体最大生命值，允许装备、药水等正常修改。

blockly.block.eca_is_max_health_locked=%1 的最大生命值是否已锁定
blockly.block.eca_is_max_health_locked.tooltip=检查实体最大生命值是否已锁定。

blockly.block.eca_get_locked_max_health=获取 %1 的锁定最大生命值
blockly.block.eca_get_locked_max_health.tooltip=获取实体的锁定最大生命值（如果未锁定则返回0）。

blockly.block.eca_ban_healing=设置 %1 的禁疗值为 %2
blockly.block.eca_ban_healing.tooltip=禁止实体回血。实体无法回血但仍可受到伤害。

blockly.block.eca_unban_healing=解除 %1 禁疗
blockly.block.eca_unban_healing.tooltip=解除实体禁疗，允许正常回血。

blockly.block.eca_is_healing_banned=%1 是否被禁疗
blockly.block.eca_is_healing_banned.tooltip=检查实体是否被禁疗。

blockly.block.eca_get_heal_ban_value=获取 %1 的禁疗值
blockly.block.eca_get_heal_ban_value.tooltip=获取实体当前的禁疗值（如果未禁疗则返回0）。

blockly.block.eca_lock_location=锁定 %1 的位置
blockly.block.eca_lock_location.tooltip=锁定实体位置至当前坐标。异常的位置变更将被还原。

blockly.block.eca_unlock_location=解锁 %1 的位置
blockly.block.eca_unlock_location.tooltip=解锁实体位置，允许自由移动/传送。

blockly.block.eca_is_location_locked=%1 的位置是否已锁定
blockly.block.eca_is_location_locked.tooltip=检查实体位置是否已锁定。

blockly.block.eca_set_global_fog=设置全局迷雾 颜色: %1 模式: %2 半径: %3
blockly.block.eca_set_global_fog.tooltip=设置当前维度的全局迷雾效果。颜色为预设选择，模式可选全局（整个维度）或半径（围绕实体）。

blockly.block.eca_clear_global_fog=清除全局迷雾
blockly.block.eca_clear_global_fog.tooltip=清除当前维度的全局迷雾效果。

blockly.block.eca_set_global_skybox=设置全局天空盒 预设: %1 透明度: %2
blockly.block.eca_set_global_skybox.tooltip=设置当前维度的全局天空盒着色器效果。

blockly.block.eca_clear_global_skybox=清除全局天空盒
blockly.block.eca_clear_global_skybox.tooltip=清除当前维度的全局天空盒效果。

blockly.block.eca_set_global_music=设置全局战斗音乐: %1 音源: %2 音量: %3 音调: %4 循环: %5
blockly.block.eca_set_global_music.tooltip=设置当前维度的全局战斗音乐。

blockly.block.eca_clear_global_music=清除全局战斗音乐
blockly.block.eca_clear_global_music.tooltip=清除当前维度的全局战斗音乐。

blockly.block.eca_clear_all_global_effects=清除所有全局效果
blockly.block.eca_clear_all_global_effects.tooltip=清除当前维度的所有全局效果（迷雾、天空盒、战斗音乐）。

blockly.block.eca_entities_in_range_foreach=强制获取范围内实体 x: %1 y: %2 z: %3 范围: %4 作为 %5 执行 %6
blockly.block.eca_entities_in_range_foreach.tooltip=使用 ECA API 遍历范围内实体（绕过 Mixin 对实体查询的修改）。

blockly.block.eca_dimension_entities_foreach=强制获取当前维度所有实体 作为 %1 执行 %2
blockly.block.eca_dimension_entities_foreach.tooltip=使用 ECA API 遍历当前维度的所有实体（无范围限制）。

blockly.block.eca_server_entities_foreach=强制获取服务器所有实体（全维度） 作为 %1 执行 %2
blockly.block.eca_server_entities_foreach.tooltip=使用 ECA API 遍历服务器所有维度的全部实体。

blockly.block.eca_dimension_typed_entities_foreach=强制获取维度 %2 中的所有 %1 作为 %3 执行 %4
blockly.block.eca_dimension_typed_entities_foreach.tooltip=使用 ECA API 遍历指定维度中指定类型的实体。
