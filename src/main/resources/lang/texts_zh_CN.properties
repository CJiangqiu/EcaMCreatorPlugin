blockly.block.eca_play_boss_show=为玩家 %1 播放演出 %3 目标为 %2
blockly.block.eca_play_boss_show.tooltip=为玩家播放BossShow演出。即使玩家已看过也会播放。

blockly.block.eca_play_boss_show_if_new=为玩家 %1 播放演出 %3 目标为 %2（未看过时）
blockly.block.eca_play_boss_show_if_new.tooltip=一次性播放流程。玩家看过该演出一次后，此流程块将不再为其触发播放。适用于只需对玩家展示一次的过场动画；如需无条件重复播放，请使用"播放演出"流程块。

blockly.block.eca_stop_boss_show=停止玩家 %1 当前正在观看的演出
blockly.block.eca_stop_boss_show.tooltip=停止玩家当前正在播放的BossShow演出。

blockly.block.eca_is_boss_show_playing=玩家 %1 是否正在观看演出
blockly.block.eca_is_boss_show_playing.tooltip=检查玩家当前是否有活跃的BossShow演出会话。

blockly.block.eca_trigger_custom_boss_show=触发名为 %1 的自定义触发类型BossShow，播放给玩家 %2，目标为 %3
blockly.block.eca_trigger_custom_boss_show.tooltip=启动所有触发器类型为 Custom 且触发器名与 %1 匹配的 BossShow 演出。这是启动一场新的播放，与当前正在播放的 BossShow 无关。

blockly.block.eca_resurrection_start=启动复活守护线程
blockly.block.eca_resurrection_start.tooltip=启动复活守护线程。它会持续监控被追踪的实体，并自动复活任何死亡或丢失容器注册的实体。

blockly.block.eca_resurrection_stop=停止复活守护线程
blockly.block.eca_resurrection_stop.tooltip=停止复活守护线程。被追踪的实体将不再被自动复活。

blockly.block.eca_resurrection_is_running=复活守护线程是否运行中
blockly.block.eca_resurrection_is_running.tooltip=检查复活守护线程当前是否正在运行。

blockly.block.eca_resurrection_add=将 %1 加入复活追踪
blockly.block.eca_resurrection_add.tooltip=将实体加入复活追踪。守护线程运行期间，该实体会在死亡后很快被自动复活。请勿用于会大量生成的实体。

blockly.block.eca_resurrection_remove=将 %1 移出复活追踪
blockly.block.eca_resurrection_remove.tooltip=将实体移出复活追踪，使其不再被自动复活。
